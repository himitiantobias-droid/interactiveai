<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar IA — mascota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
</head>
<body>

<button class="friends-btn" id="friendsBtn" type="button" aria-label="Amigos">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  </svg>
</button>

<div class="friends-map" id="friendsMap" hidden>
  <button class="friends-map-close" id="friendsMapClose" type="button" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
  <div class="friends-radar" id="friendsRadar">
    <div class="friends-radar-ring friends-radar-ring--1"></div>
    <div class="friends-radar-ring friends-radar-ring--2"></div>
    <div class="friends-radar-ring friends-radar-ring--3"></div>
    <div class="friends-radar-me"></div>
  </div>
  <p class="friends-empty" id="friendsEmpty" hidden>Todavía no te encontraste con nadie en el parque.</p>
</div>

<header>
  <div class="name-row">
    <h1 id="petName">Nombre</h1>
    <button class="edit-name" id="editNameBtn" type="button" aria-label="Editar nombre">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path d="M3 21l3.4-.9L20 6.5a1.5 1.5 0 0 0 0-2.1l-.4-.4a1.5 1.5 0 0 0-2.1 0L3.9 17.6 3 21z"/>
      </svg>
    </button>
  </div>
  <p>Una cara viva que hay que cuidar. <strong>C</strong> come, <strong>A</strong> bebe, mantené <strong>espacio</strong> para acariciarla, tocalo y soltalo rápido para jugar a la pelota, <strong>V</strong> activa/desactiva la escucha por voz.</p>
</header>

<main>
  <div class="scene" id="scene">
    <div class="park" id="park" aria-hidden="true">
      <div class="park-hill"></div>
      <div class="park-tree park-tree--a"></div>
      <div class="park-tree park-tree--b"></div>
      <div class="park-friends" id="parkFriends"></div>
    </div>

    <div class="stage" id="stage">
      <div class="avatar-frame" id="avatarFrame">
        <div class="glow" id="glow"></div>
        <svg class="avatar-face" id="avatarFace" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <g id="eyes">
            <ellipse id="eyeL" cx="68" cy="88" rx="11" ry="15"/>
            <ellipse id="eyeR" cx="132" cy="88" rx="11" ry="15"/>
          </g>
          <path id="mouth" d="M 72 132 Q 100 132 128 132"/>
        </svg>

        <div class="plate" id="plate" aria-hidden="true">
          <div class="plate-base"></div>
          <div class="kibble"></div><div class="kibble"></div><div class="kibble"></div>
          <div class="kibble"></div><div class="kibble"></div><div class="kibble"></div>
          <div class="kibble"></div><div class="kibble"></div><div class="kibble"></div>
          <div class="kibble"></div>
        </div>

        <div class="cup" id="cup" aria-hidden="true">
          <div class="cup-body"><div class="cup-water"></div></div>
        </div>

        <div class="vomit" id="vomit" aria-hidden="true"></div>
      </div>

      <div class="ball" id="ball" aria-hidden="true"></div>
    </div>
  </div>

  <div class="revive-hint" id="reviveHint" hidden>Se murió — presioná <strong>R</strong> para revivirla.</div>
</main>

<script src="script.js"></script>
</body>
</html>
